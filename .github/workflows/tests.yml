# Unit tests on Linux and native Windows (beta). Nothing here needs a GPU, Blender, Unreal or ComfyUI:
# tests marked comfy, blender, unreal or gpu are deselected, and tests marked posix skip on Windows.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"               # what the Windows launcher and ap.cmd set
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: UI scripts parse (one global scope)
        shell: bash
        run: |
          cat asset_pipeline/ui/static/*.js > "$RUNNER_TEMP/all.js"
          node --check "$RUNNER_TEMP/all.js"
      - name: Windows scripts parse on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem windows\*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($f.Name): $($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          if ($bad) { exit 1 }
      - name: Unit tests
        run: python -m pytest -m "not comfy and not blender and not unreal and not gpu" -q -rs --durations=15
